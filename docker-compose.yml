version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: finances_user
      POSTGRES_PASSWORD: finances_password
      POSTGRES_DB: finances_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    ports:
      - "7051:7051"
    environment:
      - DATABASE_URL=postgresql://finances_user:finances_password@db:5432/finances_db
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - receipts_data:/app/receipts

  frontend:
    build: ./frontend
    ports:
      - "7050:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

volumes:
  pgdata:
  receipts_data:
